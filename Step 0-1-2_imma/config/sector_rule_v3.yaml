# The sector rule of Step 0, version 3 (the accepted rule).
# step0_sector_definition.ipynb holds the same lists in its cells; tests/test_notebook_in_sync.py checks that the
# two are identical, so a change made in one place only makes the tests fail.
# All texts are compared lower-cased. Latin-script terms must start a word ('biped' also finds 'bipedal').
version: v3
description: 'Humanoid robots: a family is in the sector when its title names a humanoid robot. Accepted on 12 November 2026:
  strict precision 37/40 = 92.5% (95% Wilson interval 80.1-97.4%) on an independent random sample.'
